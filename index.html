<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A study guide for you</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2430;--mute:#5d6675;--line:#d9d5cb;--accent:#1f5fa8;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1e232b;--ink:#eceff4;--mute:#a2abba;--line:#343b47;--accent:#7db4f5;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
form{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
h1{font-size:1.35rem;margin:0 0 6px}
p{margin:0 0 18px;color:var(--mute)}
.row{display:flex;gap:8px}
label{flex:1;font-size:.8rem;color:var(--mute)}
label.m{flex:1.7}
select{display:block;width:100%;margin-top:4px;padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--bg);font:inherit;font-weight:600}
button:disabled{opacity:.6}
#msg{min-height:1.5em;margin:12px 0 0;color:var(--bad);font-size:.95rem}
</style>
</head>
<body>
<form id="f">
  <h1>This was made just for you</h1>
  <p>Enter your birthday to open your study guide.</p>
  <div class="row">
    <label class="m">Month<select id="mo" required></select></label>
    <label>Day<select id="da" required></select></label>
    <label>Year<select id="yr" required></select></label>
  </div>
  <button id="go">Open</button>
  <p id="msg" role="alert"></p>
</form>

const $ = id => document.getElementById(id);
const opt = (sel, value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; sel.append(o); };
const two = n => String(n).padStart(2, '0');
opt($('mo'), '', 'Month'); opt($('da'), '', 'Day'); opt($('yr'), '', 'Year');
['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
  .forEach((m, i) => opt($('mo'), two(i + 1), m));
for (let d = 1; d <= 31; d++) opt($('da'), two(d), d);
for (let y = 2012; y >= 1940; y--) opt($('yr'), y, y);

const bytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function unlock(birthday) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(birthday), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.i) }, key, bytes(P.c));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
const saved = () => { try { return localStorage.getItem('bd'); } catch (e) { return null; } };

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const birthday = $('yr').value + '-' + $('mo').value + '-' + $('da').value;
  $('go').disabled = true; $('msg').textContent = '';
  try {
    const html = await unlock(birthday);
    try { localStorage.setItem('bd', birthday); } catch (e) {}
    show(html);
  } catch (err) {
    $('msg').textContent = window.crypto && crypto.subtle
      ? 'That date did not open it. Check the month, day and year and try again.'
      : 'This page needs to be opened from its web link in a normal browser.';
    $('go').disabled = false;
  }
});
// Already opened on this phone before: skip the form.
if (saved()) unlock(saved()).then(show).catch(() => {});
})();
</script>
